<style>
  :root {
    --paper: #ece6d6;
    --panel: #e4dcc7;
    --ink: #16150f;
    --ink-soft: #595444;
    --ink-faint: #8c8775;
    --spot: #ff3b14;
    --ok: #1f7a3d;
    --rule: rgba(22, 21, 15, 0.16);
    --mono: 'SF Mono', 'SFMono-Regular', ui-monospace, 'Cascadia Code',
      'Roboto Mono', Menlo, Consolas, monospace;
    --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: var(--mono);
    color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(var(--rule) 1.1px, transparent 1.2px);
    background-size: 15px 15px;
    height: 100vh;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    -webkit-font-smoothing: antialiased;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .mark {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    color: var(--spot);
  }
  .wordmark {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.05em;
    line-height: 1;
  }
  .wordmark b {
    background: var(--spot);
    color: var(--paper);
    padding: 0 2px;
  }
  .tag {
    margin-top: 3px;
    font-size: 8.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  textarea {
    flex: 1;
    resize: none;
    width: 100%;
    background: var(--panel);
    border: 2px solid var(--ink);
    color: var(--ink);
    font: 500 11px/1.45 var(--mono);
    padding: 10px 12px;
    outline: none;
  }
  textarea:focus {
    box-shadow: inset 0 0 0 2px var(--spot);
  }
  textarea::placeholder {
    color: var(--ink-faint);
  }
  .row {
    display: flex;
    gap: 9px;
  }
  button {
    font-family: var(--mono);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border: 2px solid var(--ink);
    padding: 11px 14px;
    cursor: pointer;
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.11s var(--ease), box-shadow 0.11s var(--ease),
      background 0.15s, color 0.15s;
  }
  button:hover {
    transform: translate(-1px, -1px);
    box-shadow: 5px 5px 0 var(--ink);
  }
  button:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--ink);
  }
  .build {
    flex: 1;
    background: var(--spot);
    color: var(--paper);
  }
  .ghost {
    background: var(--paper);
    color: var(--ink);
  }
  .ghost:hover {
    background: var(--ink);
    color: var(--paper);
  }
  .status {
    min-height: 15px;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
    display: flex;
    gap: 6px;
  }
  .status::before {
    content: '>';
    color: var(--spot);
    font-weight: 700;
  }
  .status.ok {
    color: var(--ok);
  }
  .status.err {
    color: var(--spot);
    font-weight: 700;
  }
</style>

<div class="head">
  <svg class="mark" viewBox="0 0 32 32" fill="none">
    <rect x="1.5" y="1.5" width="29" height="29" stroke="currentColor" stroke-width="2" />
    <path d="M16 6v20M6 16h20" stroke="currentColor" stroke-width="2" />
    <circle cx="16" cy="16" r="4.5" fill="currentColor" />
  </svg>
  <div>
    <div class="wordmark">Y<b>OINK</b></div>
    <div class="tag">Paste capture · build layers</div>
  </div>
</div>

<textarea
  id="input"
  placeholder="Paste your Yoink capture here (⌘/Ctrl+V), then BUILD…"
  spellcheck="false"
></textarea>

<div class="row">
  <button class="ghost" id="paste" type="button">Paste</button>
  <button class="build" id="build" type="button">Build in Figma</button>
</div>
<div class="status" id="status"></div>

<script>
  const input = document.getElementById('input');
  const status = document.getElementById('status');

  function setStatus(message, kind) {
    status.textContent = message;
    status.className = 'status' + (kind ? ' ' + kind : '');
  }

  function build() {
    const raw = input.value.trim();
    if (!raw) {
      setStatus('Paste a Yoink capture first', 'err');
      return;
    }
    let payload;
    try {
      payload = JSON.parse(raw);
    } catch (e) {
      setStatus('That is not valid JSON', 'err');
      return;
    }
    setStatus('Building…');
    parent.postMessage({ pluginMessage: { type: 'import', payload } }, '*');
  }

  document.getElementById('build').addEventListener('click', build);

  document.getElementById('paste').addEventListener('click', async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        input.value = text;
        build();
      } else {
        setStatus('Clipboard was empty', 'err');
      }
    } catch (e) {
      input.focus();
      setStatus('Press ⌘/Ctrl+V to paste, then Build', 'err');
    }
  });

  onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'done') {
      setStatus(`Built ${msg.count} layer${msg.count === 1 ? '' : 's'} ✓`, 'ok');
    } else if (msg.type === 'error') {
      setStatus(msg.message || 'Something went wrong', 'err');
    }
  };

  input.focus();
</script>
