<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yoink</title>
    <style>
      :root {
        --paper: #ece6d6;
        --panel: #e4dcc7;
        --ink: #16150f;
        --ink-soft: #595444;
        --ink-faint: #8c8775;
        --spot: #ff3b14;
        --ok: #1f7a3d;
        --rule: rgba(22, 21, 15, 0.16);
        --mono: 'SF Mono', 'SFMono-Regular', ui-monospace, 'Cascadia Code',
          'Roboto Mono', Menlo, Consolas, monospace;
        --shadow: 4px 4px 0 var(--ink);
        --ease: cubic-bezier(0.2, 0.9, 0.3, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 360px;
        font-family: var(--mono);
        color: var(--ink);
        background-color: var(--paper);
        background-image: radial-gradient(var(--rule) 1.1px, transparent 1.2px);
        background-size: 15px 15px;
        -webkit-font-smoothing: antialiased;
      }

      .sheet {
        margin: 14px;
        border: 2px solid var(--ink);
        background: var(--paper);
        box-shadow: var(--shadow);
      }

      /* ---------- reveal ---------- */
      .r {
        opacity: 0;
        transform: translateY(7px);
        animation: rise 0.42s var(--ease) forwards;
      }
      .r1 {
        animation-delay: 0.02s;
      }
      .r2 {
        animation-delay: 0.08s;
      }
      .r3 {
        animation-delay: 0.14s;
      }
      .r4 {
        animation-delay: 0.2s;
      }
      @keyframes rise {
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* ---------- header ---------- */
      .head {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 14px 15px 13px;
        border-bottom: 2px solid var(--ink);
      }

      .mark {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        color: var(--spot);
      }

      .brand {
        flex: 1;
        min-width: 0;
      }

      .wordmark {
        font-size: 25px;
        font-weight: 700;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .wordmark b {
        background: var(--spot);
        color: var(--paper);
        padding: 0 2px;
        margin-left: 1px;
      }

      .tag {
        margin-top: 5px;
        font-size: 9.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--ink-soft);
      }

      .stamp {
        align-self: flex-start;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 3px 5px;
        border: 1.5px solid var(--ink);
        color: var(--ink);
        white-space: nowrap;
      }

      .body {
        padding: 15px;
      }

      /* ---------- buttons ---------- */
      .actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        width: 100%;
        border: 2px solid var(--ink);
        padding: 13px 14px;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 12.5px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        box-shadow: var(--shadow);
        transition: transform 0.11s var(--ease), box-shadow 0.11s var(--ease),
          background 0.15s, color 0.15s;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .btn:hover {
        transform: translate(-1px, -1px);
        box-shadow: 6px 6px 0 var(--ink);
      }
      .btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      .btn:focus-visible {
        outline: 3px solid var(--spot);
        outline-offset: 2px;
      }

      .btn-primary {
        background: var(--spot);
        color: var(--paper);
      }
      .btn-secondary {
        background: var(--paper);
        color: var(--ink);
      }
      .btn-secondary:hover {
        background: var(--ink);
        color: var(--paper);
      }

      /* ---------- status console ---------- */
      .status {
        min-height: 16px;
        margin-top: 12px;
        font-size: 11px;
        letter-spacing: 0.02em;
        color: var(--ink-soft);
        display: flex;
        gap: 7px;
      }
      .status::before {
        content: '>';
        color: var(--spot);
        font-weight: 700;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.error {
        color: var(--spot);
        font-weight: 700;
      }

      /* ---------- config panel ---------- */
      .panel {
        margin-top: 16px;
        border: 2px solid var(--ink);
        background: var(--panel);
      }
      .panel-head {
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        padding: 8px 12px;
        border-bottom: 2px solid var(--ink);
        background: var(--ink);
        color: var(--paper);
        display: flex;
        justify-content: space-between;
      }
      .panel-head span {
        color: var(--spot);
      }

      .opt {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px;
      }
      .opt + .opt {
        border-top: 1.5px dashed var(--rule);
      }
      .opt .name {
        font-size: 12.5px;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .opt .desc {
        margin-top: 3px;
        font-size: 10px;
        line-height: 1.35;
        color: var(--ink-soft);
      }

      .switch {
        position: relative;
        flex-shrink: 0;
        width: 46px;
        height: 24px;
        border: 2px solid var(--ink);
        background: var(--paper);
        cursor: pointer;
        transition: background 0.16s var(--ease);
      }
      .switch-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        background: var(--ink);
        transition: transform 0.18s var(--ease);
      }
      .switch[aria-checked='true'] {
        background: var(--spot);
      }
      .switch[aria-checked='true'] .switch-thumb {
        transform: translateX(22px);
      }
      .switch:focus-visible {
        outline: 3px solid var(--spot);
        outline-offset: 2px;
      }

      /* ---------- hint ---------- */
      .hint {
        margin-top: 14px;
        padding: 10px 12px 10px 14px;
        border: 1.5px solid var(--ink);
        border-left: 6px solid var(--spot);
        font-size: 11px;
        line-height: 1.5;
        color: var(--ink-soft);
      }
      .hint b {
        color: var(--ink);
        background: var(--paper);
      }

      /* ---------- footer ---------- */
      .foot {
        margin-top: 14px;
        padding-top: 11px;
        border-top: 1.5px dashed var(--rule);
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 9px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .foot .reg {
        color: var(--spot);
        letter-spacing: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .r {
          animation: none;
          opacity: 1;
          transform: none;
        }
        * {
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="sheet">
      <header class="head r r1">
        <svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect
            x="1.5"
            y="1.5"
            width="29"
            height="29"
            stroke="currentColor"
            stroke-width="2"
          />
          <path
            d="M16 6v20M6 16h20"
            stroke="currentColor"
            stroke-width="2"
          />
          <circle cx="16" cy="16" r="4.5" fill="currentColor" />
        </svg>
        <div class="brand">
          <div class="wordmark">Y<b>OINK</b></div>
          <div class="tag">Web → Figma · grab tool</div>
        </div>
        <div class="stamp">v<span id="versionNumber">0.0</span></div>
      </header>

      <div class="body">
        <div class="actions r r2">
          <button id="pickBtn" class="btn btn-primary" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path
                d="M3 3l7 18 2.5-7.5L20 11 3 3z"
                fill="currentColor"
              />
            </svg>
            Pick element
          </button>
          <button id="pageBtn" class="btn btn-secondary" type="button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect
                x="3.5"
                y="3.5"
                width="17"
                height="17"
                stroke="currentColor"
                stroke-width="2"
              />
            </svg>
            Whole page
          </button>
          <div
            id="status"
            class="status"
            role="status"
            aria-live="polite"
          ></div>
        </div>

        <section class="panel r r3">
          <div class="panel-head">
            <span>//</span> Capture config
          </div>
          <div class="opt">
            <div>
              <div class="name">Nest in frames</div>
              <div class="desc">Rebuild the DOM tree as nested frames.</div>
            </div>
            <button
              id="useFramesToggle"
              class="switch"
              type="button"
              role="switch"
              aria-checked="true"
              aria-label="Nest in frames"
            >
              <span class="switch-thumb"></span>
            </button>
          </div>
          <div class="opt">
            <div>
              <div class="name">Include images</div>
              <div class="desc">Bring &lt;img&gt; in as image fills by URL.</div>
            </div>
            <button
              id="includeImagesToggle"
              class="switch"
              type="button"
              role="switch"
              aria-checked="true"
              aria-label="Include images"
            >
              <span class="switch-thumb"></span>
            </button>
          </div>
        </section>

        <div class="hint r r4">
          Capture lands on your clipboard. In Figma, run the <b>Yoink</b> plugin
          → <b>Paste &amp; build</b>.
        </div>

        <div class="foot r r4">
          <span>Snatch the web</span>
          <span class="reg">⌖ ⌖ ⌖</span>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
